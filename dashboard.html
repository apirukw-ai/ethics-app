    disagree: 0,
    uncertain: 0,
    total: 0

  // 2. ฟังก์ชันส่งคำตอบของนักศึกษา
  const handleStudentSubmit = async () => {
    if (!selectedOption) {
      alert('กรุณาเลือกคำตอบก่อนส่ง');
      return;
    }

    const { data, error } = await supabaseClient
      .from('votes')
      .insert([
        { dilemma_id: currentActivity, selected_option: selectedOption }
      ]);

    if (!error) {
      setStudentSubmitted(true);
    } else {
      console.error('Submit Error:', error);
      alert('เกิดข้อผิดพลาดในการส่งข้อมูล');
    }
  };
// --- แทรกเพิ่มตรงบรรทัด 174 ---
  const [wordList, setWordList] = useState([]);

  const fetchWords = async () => {
    const { data } = await supabaseClient
      .from('responses')
      .select('text_answer')
      .eq('activity_id', currentActivity);

    if (data) {
      setWordList(data.map(d => d.text_answer));
    }
  };

  React.useEffect(() => {
    fetchWords();

    const channel = supabaseClient
      .channel('realtime_words')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'responses' }, () => {
        fetchWords();
      })
      .subscribe();

    return () => {
      supabaseClient.removeChannel(channel);
    };
  }, [currentActivity]);
  // 3. ฟังก์ชันดึงผลโหวตและฟัง Real-time จาก Supabase
  const fetchResults = async () => {
    const { data, error } = await supabaseClient
      .from('votes')
      .select('selected_option')
      .eq('dilemma_id', currentActivity);

    if (data) {
      const agree = data.filter(d => d.selected_option === 'agree').length;
      const disagree = data.filter(d => d.selected_option === 'disagree').length;
      const uncertain = data.filter(d => d.selected_option === 'uncertain').length;

      setLiveVotes({
        agree,
        disagree,
        uncertain,
        total: data.length
      });
    }
  };

  React.useEffect(() => {
    fetchResults(); // ดึงข้อมูลทันทีเมื่อเปิดหน้า

    const channel = supabaseClient
      .channel('realtime_votes')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'votes' }, () => {
        fetchResults(); // อัปเดตกราฟทันทีเมื่อมีคนส่งคำตอบใหม่
      })
      .subscribe();

    return () => {
      supabaseClient.removeChannel(channel);
    };

  const chartData = [

    { name: 'ไม่เห็นด้วย', count: liveVotes.disagree, percent: Math.round((liveVotes.disagree / (liveVotes.total || 1)) * 100), color: '#EF4444' },

                  viewMode === 'presentation' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'

              </button>
